<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5f8">
  <title>Feliz cumpleaños Tiri</title>

  <style>
    :root {
      --fondo: #fff8fa;
      --rosa: #984c69;
      --texto: #694352;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: Georgia, "Times New Roman", serif;
    }

    body.visor-abierto {
      overflow: hidden;
    }

    .portada {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      padding: 50px 28px;
      background:
        radial-gradient(ellipse at 0% 100%, #f2cfde, transparent 50%),
        radial-gradient(ellipse at 100% 0%, #fae1eb, transparent 50%),
        var(--fondo);
    }

    .portada::before {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid #dfb8c7;
      pointer-events: none;
      z-index: -1;
    }

    .contenido {
      width: min(100%, 720px);
      text-align: center;
      animation: aparecer 1s ease both;
    }

    .fecha {
      margin: 0 0 24px;
      color: var(--rosa);
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
    }

    h1 {
      margin: 0;
      color: var(--rosa);
      font-size: clamp(34px, 6vw, 60px);
      font-weight: normal;
      line-height: 1.3;
    }

    .nombre {
      display: block;
      margin: 4px 0 16px;
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-size: clamp(80px, 12vw, 120px);
      line-height: 1.25;
    }

    .dedicatoria {
      margin: 0;
      font-size: clamp(18px, 3vw, 24px);
      line-height: 1.7;
    }

    .corazones {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(8px, 2vw, 16px);
      margin: 20px 0;
      color: #c77898;
      font-size: clamp(19px, 4vw, 26px);
    }

    .corazones span:nth-child(even) {
      color: #dda1b9;
      font-size: 0.8em;
    }

    .corazones span:nth-child(4) {
      color: var(--rosa);
      font-size: 1.2em;
    }

    .frase {
      margin: 0;
      color: var(--rosa);
      font-size: clamp(23px, 4vw, 32px);
      font-style: italic;
      line-height: 1.6;
    }

    .marco-corazon {
      width: min(84vw, 470px);
      aspect-ratio: 1.08;
      margin: 28px auto 15px;
      filter: drop-shadow(0 12px 18px rgba(152, 76, 105, 0.2));
    }

    .collage-corazon {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #edb7cd;
      clip-path: url(#recorte-corazon);
    }

    .foto-corazon {
      position: absolute;
      display: block;
      overflow: hidden;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #edb7cd;
      cursor: pointer;
      appearance: none;
    }

    .foto-corazon img {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }

    /* Dos fotos arriba */
    .foto-1 {
      left: 0;
      top: 0;
      width: 50%;
      height: 42%;
    }

    .foto-2 {
      left: 50%;
      top: 0;
      width: 50%;
      height: 42%;
    }

    /* Tres fotos en el centro */
    .foto-3 {
      left: 0;
      top: 42%;
      width: 33.3334%;
      height: 25%;
    }

    .foto-4 {
      left: 33.3333%;
      top: 42%;
      width: 33.3334%;
      height: 25%;
    }

    .foto-5 {
      left: 66.6666%;
      top: 42%;
      width: 33.3334%;
      height: 25%;
    }

    /* Una foto centrada en la punta */
    .foto-6 {
      left: 20%;
      top: 67%;
      width: 60%;
      height: 33%;
    }

    .boton {
      display: inline-block;
      padding: 17px 42px;
      border: 1px solid var(--rosa);
      border-radius: 999px;
      background: var(--rosa);
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 8px 25px rgba(152, 76, 105, 0.15);
      transition: transform 0.2s, background 0.2s;
    }

    .boton:hover {
      background: #7e3c55;
      transform: translateY(-3px);
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--rosa);
      outline-offset: 4px;
    }

    .flor {
      position: absolute;
      z-index: -1;
      width: clamp(230px, 32vw, 430px);
      height: auto;
      pointer-events: none;
    }

    .flor-izquierda {
      left: -80px;
      bottom: -100px;
      transform: rotate(-18deg);
    }

    .flor-derecha {
      right: -80px;
      top: -70px;
      transform: rotate(165deg);
      opacity: 0.85;
    }

    /* Panel de ajustes: solo aparece al abrir el archivo local. */

    .editor {
      position: relative;
      z-index: 5;
      padding: 16px 20px;
      border-bottom: 1px solid #e8c8d4;
      background: #fffdfc;
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;
    }

    .editor button {
      margin: 4px;
      padding: 10px 16px;
      border: 1px solid #d6a4b7;
      border-radius: 8px;
      background: #fff1f6;
      color: var(--rosa);
      cursor: pointer;
      font: inherit;
    }

    .editor p {
      max-width: 650px;
      margin: 12px auto;
      line-height: 1.6;
    }

    .controles {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .controles input {
      width: 150px;
      accent-color: var(--rosa);
    }

    body.editando .foto-corazon {
      cursor: grab;
      touch-action: none;
    }

    body.editando .foto-corazon:active {
      cursor: grabbing;
    }

    body.editando .foto-corazon.seleccionada::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 3px solid #fff;
      pointer-events: none;
    }

    .visor {
      width: min(94vw, 1000px);
      max-height: 94vh;
      max-height: 94svh;
      padding: 18px;
      border: 1px solid #e8c8d4;
      border-radius: 12px;
      background: #fffdfc;
      color: var(--texto);
    }

    .visor::backdrop {
      background: rgba(49, 25, 35, 0.8);
    }

    .barra-visor {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 15px;
    }

    .titulo-visor {
      margin: 0;
      color: var(--rosa);
      font-size: 18px;
      font-weight: normal;
    }

    .cerrar {
      padding: 10px 16px;
      border: 1px solid #e8c8d4;
      border-radius: 999px;
      background: #fff5f8;
      color: var(--rosa);
      font-family: Arial, sans-serif;
      font-size: 13px;
      cursor: pointer;
    }

    .imagen-ampliada {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      max-height: 75svh;
      object-fit: contain;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .portada {
        padding: 45px 25px;
      }

      .portada::before {
        inset: 12px;
      }

      .flor {
        width: 220px;
        opacity: 0.45;
      }

      .flor-izquierda {
        left: -100px;
        bottom: -80px;
      }

      .flor-derecha {
        right: -100px;
        top: -70px;
      }

      .fecha {
        letter-spacing: 3px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .contenido {
        animation: none;
      }

      .boton {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="portada">

            type="button"

          >
            <img src="Imagenes/corazon/C3.JPG" alt="Foto C3 del corazón" draggable="false">

          >
            <img src="Imagenes/corazon/C4.JPG" alt="Foto C4 del corazón" draggable="false">
          </button>

          <button
            class="foto-corazon foto-5"
            type="button"

  <dialog class="visor" id="visor" aria-labelledby="titulo-visor">
    <div class="barra-visor">
      <h2 class="titulo-visor" id="titulo-visor">Una foto para ti</h2>
      <button class="cerrar" id="cerrar" type="button" autofocus>
        Cerrar ✕
      </button>
    </div>

    <img class="imagen-ampliada" id="imagen-ampliada" alt="">
  </dialog>

  <script>
    const fotos = [...document.querySelectorAll(".foto-corazon")];
    const editor = document.getElementById("editor");
    const editar = document.getElementById("editar");
    const ajustes = document.getElementById("ajustes");
    const zoom = document.getElementById("zoom");
    const guardar = document.getElementById("guardar");
    const etiqueta = document.getElementById("foto-seleccionada");

    const visor = document.getElementById("visor");
    const imagenAmpliada = document.getElementById("imagen-ampliada");
    const cerrar = document.getElementById("cerrar");

    let editando = false;
    let seleccionada = fotos[0];
    let arrastre = null;

    const limitar = (valor) => Math.max(0, Math.min(1, valor));

    function dibujarFoto(boton) {
      const imagen = boton.querySelector("img");

      if (!imagen.naturalWidth || !imagen.naturalHeight) {
        return { extraX: 0, extraY: 0 };
      }

      const ancho = boton.clientWidth;
      const alto = boton.clientHeight;
      const aumento = Number(boton.dataset.zoom);

      const escala = Math.max(
        ancho / imagen.naturalWidth,
        alto / imagen.naturalHeight
      ) * aumento;

      const anchoImagen = imagen.naturalWidth * escala;
      const altoImagen = imagen.naturalHeight * escala;

      const extraX = Math.max(0, anchoImagen - ancho);
      const extraY = Math.max(0, altoImagen - alto);

      const posicionX = limitar(Number(boton.dataset.px));
      const posicionY = limitar(Number(boton.dataset.py));

      imagen.style.width = anchoImagen + "px";
      imagen.style.height = altoImagen + "px";
      imagen.style.transform =
        "translate(" +
        (-extraX * posicionX) + "px, " +
        (-extraY * posicionY) + "px)";

      return { extraX, extraY };
    }

    function dibujarTodas() {
      fotos.forEach(dibujarFoto);
    }

    function seleccionar(boton) {
      seleccionada = boton;

      fotos.forEach((foto) => {
        foto.classList.toggle("seleccionada", foto === boton);
      });

      etiqueta.textContent = "Foto C" + boton.dataset.numero;
      zoom.value = boton.dataset.zoom;
    }

    if (window.location.protocol === "file:") {
      editor.hidden = false;
    }

    editar.addEventListener("click", () => {
      editando = !editando;
      document.body.classList.toggle("editando", editando);
      ajustes.hidden = !editando;

      editar.textContent = editando
        ? "Terminar ajustes"
        : "Ajustar fotos";

      if (editando) {
        seleccionar(seleccionada);
      } else {
        fotos.forEach((foto) => {
          foto.classList.remove("seleccionada");
        });
      }
    });

    zoom.addEventListener("input", () => {
      seleccionada.dataset.zoom = zoom.value;
      dibujarFoto(seleccionada);
    });

    fotos.forEach((boton) => {
      const imagen = boton.querySelector("img");

      imagen.addEventListener("load", () => {
        dibujarFoto(boton);
      });

      if (imagen.complete) {
        dibujarFoto(boton);
      }

      boton.addEventListener("click", () => {
        if (editando) {
          seleccionar(boton);
          return;
        }

        imagenAmpliada.src = imagen.src;
        imagenAmpliada.alt = imagen.alt;
        visor.showModal();
        document.body.classList.add("visor-abierto");
      });

      boton.addEventListener("pointerdown", (evento) => {
        if (!editando) return;
        if (evento.pointerType === "mouse" && evento.button !== 0) return;

        seleccionar(boton);
        evento.preventDefault();

        const medidas = dibujarFoto(boton);

        arrastre = {
          boton,
          pointerId: evento.pointerId,
          inicioX: evento.clientX,
          inicioY: evento.clientY,
          posicionX: Number(boton.dataset.px),
          posicionY: Number(boton.dataset.py),
          extraX: medidas.extraX,
          extraY: medidas.extraY
        };

        boton.setPointerCapture(evento.pointerId);
      });

      boton.addEventListener("pointermove", (evento) => {
        if (!arrastre || arrastre.boton !== boton) return;
        if (arrastre.pointerId !== evento.pointerId) return;

        const movimientoX = evento.clientX - arrastre.inicioX;
        const movimientoY = evento.clientY - arrastre.inicioY;

        if (arrastre.extraX > 0) {
          boton.dataset.px = limitar(
            arrastre.posicionX - movimientoX / arrastre.extraX
          ).toFixed(5);
        }

        if (arrastre.extraY > 0) {
          boton.dataset.py = limitar(
            arrastre.posicionY - movimientoY / arrastre.extraY
          ).toFixed(5);
        }

        dibujarFoto(boton);
      });

      function terminarArrastre(evento) {
        if (!arrastre || arrastre.boton !== boton) return;
        if (arrastre.pointerId !== evento.pointerId) return;

        if (boton.hasPointerCapture(evento.pointerId)) {
          boton.releasePointerCapture(evento.pointerId);
        }

        arrastre = null;
      }

      boton.addEventListener("pointerup", terminarArrastre);
      boton.addEventListener("pointercancel", terminarArrastre);
    });

    window.addEventListener("resize", dibujarTodas);

    guardar.addEventListener("click", () => {
      const copia = document.documentElement.cloneNode(true);

      copia.querySelector("body").classList.remove(
        "editando",
        "visor-abierto"
      );

      copia.querySelector("#editor").hidden = true;
      copia.querySelector("#ajustes").hidden = true;
      copia.querySelector("#editar").textContent = "Ajustar fotos";

      copia.querySelectorAll(".foto-corazon").forEach((foto) => {
        foto.classList.remove("seleccionada");
        foto.querySelector("img").removeAttribute("style");
      });

      copia.querySelector("#visor").removeAttribute("open");
      copia.querySelector("#imagen-ampliada").removeAttribute("src");

      const contenido = "<!DOCTYPE html>\n" + copia.outerHTML;
      const archivo = new Blob(
        [contenido],
        { type: "text/html;charset=utf-8" }
      );

      const enlace = document.createElement("a");
      const direccion = URL.createObjectURL(archivo);

      enlace.href = direccion;
      enlace.download = "index.html";
      document.body.appendChild(enlace);
      enlace.click();
      enlace.remove();

      setTimeout(() => {
        URL.revokeObjectURL(direccion);
      }, 1000);
    });

    cerrar.addEventListener("click", () => {
      visor.close();
    });

    visor.addEventListener("click", (evento) => {
      if (evento.target !== visor) return;

      const limites = visor.getBoundingClientRect();

      const fuera =
        evento.clientX < limites.left ||
        evento.clientX > limites.right ||
        evento.clientY < limites.top ||
        evento.clientY > limites.bottom;

      if (fuera) {
        visor.close();
      }
    });

    visor.addEventListener("close", () => {
      document.body.classList.remove("visor-abierto");
      imagenAmpliada.removeAttribute("src");
    });
  </script>
</body>
</html>
